- name: 11. Create Patroni configuration
  hosts: psqlserver
  become: true
  vars_files:
    - './settings.yml'
  tasks:
    - name: Config. Bash. Copy config.yml to patroni conf dir
      ansible.builtin.copy:
        src: ./patroni-config.yml
        dest: /etc/patroni/config.yml

    - name: Config.  patroni
      ansible.builtin.file:
        path: /etc/patroni/config.yml
        owner: 'postgres'
        group: 'postgres'
        mode: '0700'
  
    - name: Config.  patroni log
      ansible.builtin.shell:  chown postgres:postgres -R /var/log/patroni/
      when:
        - ansible_facts['distribution'] == "RED" or ansible_facts['distribution'] == "RedOS"
        - ansible_facts['distribution_major_version'] in ["7", "8"]

    - name: "Изменить ExecStart в файле сервиса Patroni"
      lineinfile:
        path: /usr/lib/systemd/system/patroni.service
        regexp: '^ExecStart=.*'
        line: 'ExecStart=/usr/bin/patroni /etc/patroni/config.yml'
      when:
        - ansible_facts['distribution'] == "RED" or ansible_facts['distribution'] == "RedOS"
        - ansible_facts['distribution_major_version'] in ["7", "8"]

    - name: reload_systemd
      systemd:
        daemon_reload: yes
      when:
        - ansible_facts['distribution'] == "RED" or ansible_facts['distribution'] == "RedOS"
        - ansible_facts['distribution_major_version'] in ["7", "8"]


