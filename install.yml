- name: 8. Start etcd on all nodes simultaneously
  hosts: etcdserver
  become: true
  vars_files:
    - './settings.yml'
  tasks:
    - name: Start etcd in background
      ansible.builtin.shell: |
        systemctl daemon-reload
        systemctl restart etcd.service &
      args:
        executable: /bin/bash
      async: 10
      poll: 0

    - name: Wait for etcd to form cluster
      ansible.builtin.pause:
        seconds: 3

- name: 9. Verify etcd cluster status
  hosts: etcd1server
  become: true
  vars_files:
    - './settings.yml'
  tasks:
    - name: Check etcd endpoint status
      ansible.builtin.shell: |
        etcdctl --endpoints=http://{{ hostvars[groups['etcdserver'][0]]['etcd_net'] }}:2379,http://{{ hostvars[groups['etcdserver'][1]]['etcd_net'] }}:2379,http://{{ hostvars[groups['etcdserver'][2]]['etcd_net'] }}:2379 endpoint status --cluster
      args:
        executable: /bin/bash
      register: etcd_status
      until: etcd_status.rc == 0
      retries: 3
      delay: 5

    - name: Show etcd cluster status
      ansible.builtin.debug:
        var: etcd_status.stdout_lines

- name: 10. Update etcd state to existing
  hosts: etcdserver
  become: true
  serial: 1
  vars_files:
    - './settings.yml'
  tasks:
    - name: Change cluster state
      ansible.builtin.replace:
        path: /etc/default/etcd
        regexp: 'ETCD_INITIAL_CLUSTER_STATE="new"'
        replace: 'ETCD_INITIAL_CLUSTER_STATE="existing"'

    - name: Restart etcd
      ansible.builtin.shell: |
        systemctl enable etcd.service
        systemctl restart etcd.service &
      args:
        executable: /bin/bash
      async: 10
      poll: 0

    - name: Pause between restarts
      ansible.builtin.pause:
        seconds: 3

