#          - etcd-client
#          - patroni
#          - python3-consul
#          - python3-etcd
#          - keepalived
#          - iptables
#          - iptables-persistent
        state: present
        update_cache: yes
      when: 
        - ansible_facts['distribution'] == "RED" or ansible_facts['distribution'] == "RedOS" 
        - ansible_facts['distribution_major_version'] in ["7", "8"] 
      
    - name: Убрать /etc/hosts из под управления cloud init
      ansible.builtin.lineinfile:
        path: /etc/cloud/cloud.cfg
        regexp: 'update_etc_hosts'
        state: absent
      ignore_errors: yes 
      
    - name: Config | Give postgres user rights to read mandatory access control database
      ansible.builtin.shell: |
        usermod -a -G shadow postgres
        setfacl -d -m u:postgres:r /etc/parsec/macdb 2>/dev/null || true
        setfacl -R -m u:postgres:r /etc/parsec/macdb 2>/dev/null || true
        setfacl -m u:postgres:rx /etc/parsec/macdb 2>/dev/null || true
        setfacl -d -m u:postgres:r /etc/parsec/capdb 2>/dev/null || true
        setfacl -R -m u:postgres:r /etc/parsec/capdb 2>/dev/null || true
        setfacl -m u:postgres:rx /etc/parsec/capdb 2>/dev/null || true
        pdpl-user -l 0:0 postgres 2>/dev/null || true
        pdpl-user -l 0:0 replica_role 2>/dev/null || true
      args:
        executable: /bin/bash
      when: ansible_facts['distribution'] == "Astra Linux"
     
    - name: Config | Selinux off
      ansible.builtin.shell: |
        sed -i 's/^SELINUX=.*/SELINUX=disabled/' /etc/selinux/config
        setenforce 0 || true
      ignore_errors: true
      args:
        executable: /bin/bash
      when: 
        - ansible_facts['distribution'] == "RED" or ansible_facts['distribution'] == "RedOS" 
        - ansible_facts['distribution_major_version'] in ["7", "8"] 
      

    - name: Stop and disable standard PostgreSQL
      ansible.builtin.shell: |
        systemctl stop postgrespro-std-{{ P_VER }} 2>/dev/null || true
      args:
        executable: /bin/bash

    - name: Stop patroni if running
      ansible.builtin.shell: |
        systemctl stop patroni 2>/dev/null || true
      args:
        executable: /bin/bash

    - name: Stop keepalived if running
      ansible.builtin.shell: |
        systemctl stop keepalived 2>/dev/null || true
      args:
        executable: /bin/bash

    - name: Stop etcd if running
      ansible.builtin.shell: |
        systemctl stop etcd 2>/dev/null || true
      args:
        executable: /bin/bash

    - name: DELETE  PGDATA
      ansible.builtin.shell: |
        rm -rf "{{ DATA }}"/*
      args:
        executable: /bin/bash
      when: 
       - DATA is defined
       - DATA | length > 0
       - DATA != ""

    - name: DELETE WAL
      ansible.builtin.shell: |
        rm -rf "{{ WAL }}"/*
      args:
        executable: /bin/bash
      when: 
       - WAL is defined
       - WAL | length > 0
       - WAL != ""


