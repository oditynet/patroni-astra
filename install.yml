---
- name: 1. Prepare all nodes - Create users and install packages
  hosts: psqlserver
  become: true
  gather_facts: yes
  vars_files:
    - './settings.yml'
  tasks:
    - name: "Проверить переменную DATA"
      fail:
         msg: "Переменная DATA не определена или пуста!"
      when: 
      - DATA is not defined or DATA | length == 0
 
    - name: "Проверить переменную P_VER"
      fail:
         msg: "Переменная P_VER не определена или пуста!"
      when: 
      - P_VER is not defined or P_VER | length == 0

    - name: "Проверить существование сетевого интерфейса {{ ETH_VIP }}"
      fail:
        msg: |
           ❌ Сетевой интерфейс '{{ ETH_VIP }}' не найден в системе!
           Доступные интерфейсы: {{ ansible_interfaces | join(', ') }}
      when: 
      - ETH_VIP is defined
      - ETH_VIP not in ansible_interfaces

 
    - name: APT | Remove cdrom from sources.list
      ansible.builtin.replace:
        path: /etc/apt/sources.list
        regexp: '^deb cdrom.*'
        replace: ''
      when: ansible_facts['distribution'] == "Astra Linux" 

 
    - name: Create postgres system user
      ansible.builtin.user:
        name: postgres
        password: "!"
        shell: /bin/bash
        create_home: yes
        home: /home/postgres
        state: present
      ignore_errors: yes

    - name: Create replica_role system user
      ansible.builtin.user:
        name: replica_role
        password: '!'
        shell: /bin/bash
        create_home: yes
        state: present

    - name: Create rewind_role system user
      ansible.builtin.user:
        name: rewind_role
        password: '!'
        shell: /bin/bash
        create_home: yes
        state: present
    
    - name: DNF | MkRepository for PostgreSQL pro 
      ansible.builtin.shell: |
        mkdir /opt/pgpro-cert-redos
        
        cat > /etc/yum.repos.d/pgpro-cert.repo << EOF
        [postgrespro-crt]
        name=Postgres Pro Cert repository
        baseurl=file:///opt/pgpro-cert-redos/{{ ansible_distribution_version }}/os/x86_64/rpms
        gpgcheck=0
        enabled=1

        EOF
      args:
        executable: /bin/bash
      when:
        - ansible_facts['distribution'] == "RED" or ansible_facts['distribution'] == "RedOS" 
        - ansible_facts['distribution_major_version'] == "7"

    - name: DNF | MkRepository for PostgreSQL pro 
      ansible.builtin.shell: |
        mkdir /opt/pgpro-cert-redos
        
        cat > /etc/yum.repos.d/pgpro-cert.repo << EOF
        [postgrespro-crt]
        name=Postgres Pro Cert repository
        baseurl=file:///opt/pgpro-cert-redos/{{ ansible_distribution_major_version }}/os/x86_64/rpms
        gpgcheck=0
        enabled=1

        EOF
      args:
        executable: /bin/bash
      when:
        - ansible_facts['distribution'] == "RED" or ansible_facts['distribution'] == "RedOS" 
        - ansible_facts['distribution_major_version'] == "8"

    - name: APT | MkRepository for PostgreSQL pro
      ansible.builtin.shell: |
        mkdir /opt/pgpro-cert-astra
        cat > /etc/apt/sources.list.d/pgpro-cert.list << EOF
        deb [trusted=yes] file:///opt/pgpro-cert-astra/1.7/ 1.7_x86-64 main

        EOF
      args:
        executable: /bin/bash
      when: 
         - ansible_facts['distribution'] == "Astra Linux"
         - ansible_distribution_release.startswith("1.7")


    - name: APT | MkRepository for PostgreSQL pro
      ansible.builtin.shell: |
        mkdir /opt/pgpro-cert-astra
