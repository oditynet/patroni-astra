          - "  Master:  {{ hostvars[groups['psqlserver'][0]]['ansible_host'] }}:5432"
          - "  Replica: {{ hostvars[groups['psqlserver'][1]]['ansible_host'] }}:5432"
          - "  Replica: {{ hostvars[groups['psqlserver'][2]]['ansible_host'] }}:5432"
          - "  VIP:     {{ VIP }}:5432 (follows master via keepalived + leader_check.sh)"
