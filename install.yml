#      when: 
#       - not (item.skip_if_empty | default(false))
#       - item.path | length > 0

    - name: "Создать основные директории PostgreSQL"
      ansible.builtin.file:
         path: "{{ item.path }}"
         state: directory
         mode: "{{ item.mode }}"
         owner: postgres
         group: postgres
         recurse: "{{ item.recurse | default(false) }}"
      loop:
        - { path: "{{ DATA }}/pgpro-cert-{{ P_VER }}", mode: "0750" }
        #- { path: "{{ DATA }}/pgpro-cert-{{ P_VER }}/main/conf.d", mode: "0750" } #redos8 надо удалить, redod7.3 тоже без нее установился, smolensk 1.7 тоже без нее работает
        - { path: "{{ DATA }}", mode: "0700", recurse: true }
      when: 
       - DATA is defined
       - DATA | length > 0
       - DATA != ""

    - name: "Создать WAL-директории (если WAL определена)"
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0750"
        owner: postgres
        group: postgres
      loop:
       - "{{ WAL }}/pgpro-cert-{{ P_VER }}"
       - "{{ WAL }}"
      when: 
       - WAL is defined
       - WAL | length > 0
       - WAL != ""

    - name: Create required directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: postgres
        group: postgres
        mode: '0750'
      loop:
        - /var/log/patroni
        - /var/run/postgresql


    - name: Create pgpass file for Patroni
      ansible.builtin.copy:
        dest: "/home/postgres/.pgpass_patroni"
        content: |
          *:*:*:postgres:{{ pass_postgres }}
          *:*:replication:replica_role:{{ pass_repl }}
          *:*:*:rewind_role:rewind
        owner: postgres
        group: postgres
        mode: '0600'


