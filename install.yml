    - name: APT | Install required packages
      ansible.builtin.apt:
        name:
          - vim
          - postgrespro-std-{{ P_VER }}
          - postgrespro-std-{{ P_VER }}-server
          - postgrespro-std-{{ P_VER }}-client 
          - postgrespro-std-{{ P_VER }}-libs
          - postgrespro-std-{{ P_VER }}-contrib
#          - postgresql
#          - postgresql-client
          - python-psycopg2
          - python3-psycopg2
          - acl
          - python-ipaddress
          - python3-pexpect
          - python-pexpect
          - python-pkg-resources
          - python3-pkg-resources
          - etcd-server
          - etcd-client
          - patroni
          - python3-consul
          - python3-etcd
          - keepalived
          - iptables
          - iptables-persistent
        state: present
        update_cache: yes
      when: ansible_facts['distribution'] == "Astra Linux"
      
    - name: DNF | Install required packages
      ansible.builtin.yum:
        name:
          - vim
          - postgrespro-std-{{ P_VER }}
          - postgrespro-std-{{ P_VER }}-server
          - postgrespro-std-{{ P_VER }}-client 
          - postgrespro-std-{{ P_VER }}-libs
            # - postgrespro-std-{{ P_VER }}-contrib
          - patroni-etcd
          - etcd
          - keepalived
          - python3-libselinux

#          - postgresql
#          - postgresql-client
#          - python-psycopg2
#          - python3-psycopg2
#          - acl
#          - python-ipaddress
