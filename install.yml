# ==================== VERIFICATION ====================

- name: 15. Verify Patroni cluster status
  hosts: psql1server
  become: true
  vars_files:
    - './settings.yml'
  tasks:
    - name: Check Patroni cluster
      ansible.builtin.shell: patronictl -c /etc/patroni/config.yml list
      args:
        executable: /bin/bash
      register: cluster_status
      until: cluster_status.rc == 0 and 'running' in cluster_status.stdout
      retries: 10
      delay: 10

    - name: Display cluster status
      ansible.builtin.debug:
        var: cluster_status.stdout_lines

- name: 16. Test leader check script
  hosts: psqlserver
  become: true
  vars_files:
    - './settings.yml'
  tasks:
    - name: Run leader check
      ansible.builtin.shell: |
        /etc/keepalived/leader_check.sh && echo "MASTER" || echo "REPLICA"
      args:
        executable: /bin/bash
      register: role

    - name: Check VIP
      ansible.builtin.shell: |
        ip addr show | grep "{{ VIP }}" || echo "VIP not here"
      args:
        executable: /bin/bash
      register: vip

    - name: Display status
      ansible.builtin.debug:
        msg:
          - "Node {{ ansible_host }}: {{ role.stdout_lines[-1] }} | VIP {{ VIP }}: {{ 'ACTIVE' if VIP in vip.stdout else 'STANDBY' }}"

- name: 17. Final summary
  hosts: localhost
  connection: local
  vars_files:
    - './settings.yml'
  tasks:
