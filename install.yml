- name: Patroni | Server "psql1server". Edit patroni.yml in patroni conf dir.
  hosts: psql1server
  become: true
  vars_files:
    - './settings.yml'
  tasks:

    - name: " Получить системную локаль"
      shell: localectl |grep "System Locale"|awk -F "=" '{print $2}'
      register: system_locale

    - name: Config patroni. WAL enable
      ansible.builtin.shell: |
        sed -i "s/#param1//g" config.yml
        sed -i "s|wal_data_dir|{{ WAL }}|g" config.yml 
      args:
        executable: /bin/bash
        chdir: /etc/patroni
      when: WAL is defined and WAL | length > 0

    - name: Config. Bash. Copy config.yml to patroni conf dir. Start service
      ansible.builtin.shell: |
        sed -i "s/param0/{{ ansible_hostname }}/g" config.yml
        #sed -i "s|wal_data_dir|{{ WAL }}|g" config.yml        
        sed -i "s|pg_data_dir|{{ DATA }}|g" config.yml        
        sed -i "s/paramet2/{{ P_VER }}/g" config.yml
        sed -i "s|param2|{{ CLUSTER_NET }}|g" config.yml
        sed -i "s/param3/{{ hostvars[groups['etcdserver'][0]]['etcd_net'] }}/g" config.yml
        sed -i "s/param4/{{ hostvars[groups['etcdserver'][1]]['etcd_net'] }}/g" config.yml
        sed -i "s/param5/{{ hostvars[groups['etcdserver'][2]]['etcd_net'] }}/g" config.yml
        sed -i "s/param7/{{ pass_postgres }}/g" config.yml
        sed -i "s/param8/{{ pass_repl }}/g" config.yml
        sed -i "s/param6/{{ hostvars[groups['etcdserver'][0]]['etcd_net'] }}/g" config.yml
        sed -i "s/param_locale/{{ system_locale.stdout }}/g" config.yml
        
      args:
        executable: /bin/bash
        chdir: /etc/patroni
    

