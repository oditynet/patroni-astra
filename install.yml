# ==================== KEEPALIVED CONFIGURATION ====================
- name: 4.1 Configure keepalived on MASTER PostgreSQL nodes
  hosts: psql1server
  become: true
  vars_files:
    - './settings.yml'
  tasks:
    - name: Create keepalived configuration with Patroni checks
      ansible.builtin.shell: |
        cat > /etc/keepalived/keepalived.conf << EOF
        global_defs {
            script_user root
            enable_script_security
        }
        
        vrrp_script leader_check {
            script "/etc/keepalived/leader_check.sh"
            interval 1
            fall 1
            rise 1
        }
        
        vrrp_instance PG_MASTER_VIP {
            interface {{ ETH_VIP }}
            virtual_router_id 51
            priority 255
            advert_int 1
            state MASTER
            authentication {
                auth_type PASS
                auth_pass P@sswd
            }
            virtual_ipaddress {
                {{ VIP }}/24
            }
            track_script {
                leader_check
            }
        }
        EOF
      args:
        executable: /bin/bash


- name: 4.2 Configure keepalived on BACKUP PostgreSQL nodes
  hosts: psql2server,psql3server
  become: true
  vars_files:
    - './settings.yml'
  tasks:
    - name: Create keepalived configuration with Patroni checks
      ansible.builtin.shell: |
        cat > /etc/keepalived/keepalived.conf << EOF
        global_defs {
            script_user root
            enable_script_security
        }
        
        vrrp_script leader_check {
            script "/etc/keepalived/leader_check.sh"
            interval 1
            fall 1
            rise 1
        }
        
        vrrp_instance PG_MASTER_VIP {
            interface {{ ETH_VIP }}
            virtual_router_id 51
            priority 254
            advert_int 1
            state BACKUP
            authentication {
                auth_type PASS
                auth_pass P@sswd
            }
            virtual_ipaddress {
                {{ VIP }}/24
            }
            track_script {
                leader_check
            }
        }
        EOF
      args:
        executable: /bin/bash

- name: 5. Start keepalived on all nodes
  hosts: psqlserver
  become: true
  vars_files:
    - './settings.yml'
  tasks:
    - name: Start keepalived
      ansible.builtin.shell: |
        systemctl daemon-reload
        systemctl restart keepalived.service &
      args:
        executable: /bin/bash
      async: 10
      poll: 0

# ==================== ETCD CLUSTER ====================

- name: 6. Clean etcd data on all nodes
  hosts: etcdserver
  become: true
  tasks:
#    - name: Stop etcd
#      ansible.builtin.shell: systemctl stop etcd 2>/dev/null || true
#      args:
#        executable: /bin/bash

    - name: APT | Remove old etcd data
      ansible.builtin.shell: /bin/rm -rf /var/lib/etcd/*
      args:
        executable: /bin/bash
#      when: ansible_facts['distribution'] == "Astra Linux"


    - name: Create fresh etcd directory
      ansible.builtin.file:
        path: /var/lib/etcd/default
        state: directory
        owner: etcd
        group: etcd
        mode: '0750'
#      when: ansible_facts['distribution'] == "Astra Linux"


    - name: DNF | Создать etcd службу systemd
      ansible.builtin.copy:
       dest: /usr/lib/systemd/system/etcd.service
       mode: '0644'
       content: |
         [Unit]
         Description=etcd key-value store
         Documentation=https://github.com/etcd-io/etcd
         After=network.target
         After=network-online.target
         Wants=network-online.target
         
         [Service]
         Type=notify
         WorkingDirectory=/var/lib/etcd
         EnvironmentFile=-/etc/default/etcd
         User=etcd
         ExecStart=/usr/bin/etcd
         Restart=always
         RestartSec=10s
         LimitNOFILE=65536
          
         [Install]
         WantedBy=multi-user.target

      when:
        - ansible_facts['distribution'] == "RED" or ansible_facts['distribution'] == "RedOS"
        - ansible_facts['distribution_major_version'] in ["7", "8"]

- name: 7. APT | Configure etcd on 1 nodes
  hosts: etcd1server
  become: true
  vars_files:
    - './settings.yml'
  tasks:
    - name: Create etcd configuration
      ansible.builtin.shell: |
        cat > /etc/default/etcd << 'EOF'
        #[Member]
        ETCD_DATA_DIR="/var/lib/etcd/default"
        ETCD_LISTEN_PEER_URLS="http://0.0.0.0:2380"
        ETCD_LISTEN_CLIENT_URLS="http://0.0.0.0:2379"
        ETCD_NAME="{{ inventory_hostname }}"
        ETCD_HEARTBEAT_INTERVAL="1000"
        ETCD_ELECTION_TIMEOUT="5000"
        ETCD_ENABLE_V2="false"
        ETCD_STRICT_RECONFIG_CHECK="true"
        #[Clustering]
        ETCD_INITIAL_ADVERTISE_PEER_URLS="http://{{ hostvars[groups['etcdserver'][0]]['etcd_net'] }}:2380"
        ETCD_ADVERTISE_CLIENT_URLS="http://{{ hostvars[groups['etcdserver'][0]]['etcd_net'] }}:2379"
        ETCD_INITIAL_CLUSTER_TOKEN="etcdcluster"
        ETCD_INITIAL_CLUSTER="etcd1server=http://{{ hostvars[groups['etcdserver'][0]]['etcd_net'] }}:2380,etcd2server=http://{{ hostvars[groups['etcdserver'][1]]['etcd_net'] }}:2380,etcd3server=http://{{ hostvars[groups['etcdserver'][2]]['etcd_net'] }}:2380"
        ETCD_INITIAL_CLUSTER_STATE="new"
        EOF
      args:
        executable: /bin/bash
      when: ansible_facts['distribution'] == "Astra Linux" 

