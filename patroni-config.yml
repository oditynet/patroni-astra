name: param0
scope: psqlserver
namespace: /service/

log:
    level: WARNING
    dir: /var/log/patroni

bootstrap:
    dcs:
      ttl: 40
      loop_wait: 10
      retry_timeout: 10
      maximum_lag_on_failover: 33554432
      synchronous_mode: true
      synchronous_mode_strict: false
      postgresql:
        create_replica_methods:
         - basebackup
        use_pg_rewind: true
        use_slots: true
        parameters:
          max_locks_per_transaction: 150
          listen_addresses: '*'
          wal_level: replica
          hot_standby: "on"
          synchronous_commit: "on"
          max_connections: 2000
          max_wal_senders: 10
          max_replication_slots: 10
          wal_keep_segments: 10
          wal_log_hints: "on"
          checkpoint_timeout: 300

etcd:
    hosts: param3:2379,param4:2379,param5:2379

postgresql:
    authentication:
        superuser:
            username: super_role
            password: param6
        replication:
            username: replica_role
            password: param7
        rewind:
            username: rewind
            password: rewind
    connect_address: param2:5432
    data_dir:  /var/lib/postgresql/11/main/
    pgpass:  /var/lib/postgresql/.pgpass_patroni    
    bin_dir: /usr/lib/postgresql/11/bin
    listen: "0.0.0.0:5432"
    use_unix_socket: true
    parameters:
        unix_socket_directories: '/var/run/postgresql/'
        autovacuum_analyze_scale_factor: 0.05
        checkpoint_timeout: 15min
        maintenance_work_mem: 512MB
        max_wal_size: 1GB
        min_wal_size: 128MB
        shared_buffers: 2GB
        wal_buffers: -1

restapi:
    connect_address: param2:8008
    listen: 0.0.0.0:8008
    authentication:
       username: patroni
       password: patroni

