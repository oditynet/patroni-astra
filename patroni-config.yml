name: param0
scope: ai-pg

log:
    level: WARNING
    dir: /var/log/patroni

bootstrap:
    initdb:
    - encoding: UTF8
    - data-checksums
    - locale: param_locale
    - lc-messages: param_locale
    - auth-host: scram-sha-256
    - auth-local: peer
#param1    - waldir: wal_data_dir/pgpro-cert-paramet2/

    dcs:
        synchronous_mode: true
        synchronous_mode_strict: true

        postgresql:
            use_pg_rewind: true
            use_slots: false
#param1            basebackup: 
#param1            - waldir: wal_data_dir/pgpro-cert-paramet2/
            
            parameters:
                listen_addresses: '0.0.0.0'
                port: 5432
                max_connections: '1010'
                superuser_reserved_connections: '10'
                password_encryption: 'scram-sha-256'
                  #10 G!!!!!!!!!!!!!!!!!!!!!!!
                shared_buffers: '10GB'
                work_mem: '16MB'
                maintenance_work_mem: '128MB'
                effective_io_concurrency: '200'
                max_worker_processes: '16'
                max_parallel_workers_per_gather: '2'
                max_parallel_maintenance_workers: '2'
                max_parallel_workers: '16'
                wal_level: 'replica'
                fsync: 'on'
                synchronous_commit: 'on'
                full_page_writes: 'on'
                wal_log_hints: 'on'
                wal_compression: 'lz4'
                wal_init_zero: 'off'
                wal_buffers: '64MB'
                checkpoint_timeout: '15min'
                checkpoint_completion_target: '0.9'
                max_wal_size: '16GB'
                min_wal_size: '4GB'
                max_wal_senders: '10'
                max_replication_slots: '10'
                hot_standby: 'on'
                random_page_cost: '1.1'
                effective_cache_size: '20GB'
                default_toast_compression: 'lz4'
                log_destination: 'stderr'
                logging_collector: 'on'
                log_directory: 'log'
                log_filename: 'postgresql-%Y-%m-%d.log'
                log_rotation_age: '1d'
                log_rotation_size: '0'
                log_truncate_on_rotation: 'off'
                log_line_prefix: '%t [%p]: [%l-1] us=%u,db=%d,app=%a,cli=%h'
                log_min_messages: 'warning'
                log_min_error_statement: 'error'
                log_min_duration_statement: '1000'
                log_checkpoints: 'on'
                log_connections: 'on'
                log_disconnections: 'on'
                timezone: 'Europe/Moscow'
                lc_messages: 'en_US.utf8'
                restart_after_crash: 'off'
            pg_hba:
                - local all         all                         peer
                - host  all         all         127.0.0.1/32    scram-sha-256
                - local replication all                         peer
                - host  replication all         127.0.0.1/32    scram-sha-256
                - host  replication replicator  param2     scram-sha-256
                - host  all         all         0.0.0.0/0       scram-sha-256

etcd3:
    hosts: 
    - param3:2379
    - param4:2379
    - param5:2379
    protocol: http

postgresql:
    authentication:
        superuser:
            username: postgres
            password: param7
        replication:
            username: replicator
            password: param8
        rewind:
            username: rewind
            password: rewind
    connect_address: param6:5432
    data_dir: pg_data_dir/pgpro-cert-paramet2/
    bin_dir: /opt/pgpro/std-paramet2/bin
    listen: 0.0.0.0:5432

    use_unix_socket: true
    pgpass: /home/postgres/.pgpass_patroni
    parameters:
        lc_messages: param_locale
        lc_monetary: param_locale
        lc_numeric:  param_locale
        lc_time:  param_locale
        unix_socket_directories: '/tmp'
    pg_ctl_timeout: 300

restapi:
    connect_address: param6:8008
    listen: 0.0.0.0:8008
    verify_client: optional

watchdog:
    mode: off
